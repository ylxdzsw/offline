<template id="offline-shell-template">
    <style>
        :host {
            display: block;
            width: min(100%, var(--shell-max));
            min-height: var(--app-height);
            margin: 0 auto;
            color: var(--ink);
            background: var(--bg-shell);
            box-shadow: var(--shadow);
        }
        :host(:not([page="gallery"])) {
            height: var(--app-height);
            min-height: 0;
            overflow: hidden;
        }
        .layout {
            display: grid;
            min-height: var(--app-height);
            grid-template-rows: auto 1fr auto;
        }
        :host(:not([page="gallery"])) .layout {
            height: 100%;
            min-height: 0;
            grid-template-rows: auto minmax(0, 1fr);
        }
        header {
            position: sticky;
            z-index: 20;
            top: 0;
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            align-items: center;
            min-height: calc(48px + var(--safe-top));
            padding: var(--safe-top) 4px 0;
            color: var(--ink);
            background: var(--header-bg);
            border-bottom: 0.5px solid var(--header-border);
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
        }
        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 650;
            letter-spacing: -.015em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .icon-btn {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: inherit;
            transition: background .12s ease;
        }
        .icon-btn[hidden] { display: none; }
        .icon-btn:active { background: var(--bg-fill); }
        /* Hamburger lines */
        .hamburger, .hamburger::before, .hamburger::after {
            display: block;
            width: 17px;
            height: 1.5px;
            border-radius: 1px;
            background: currentColor;
        }
        .hamburger { position: relative; }
        .hamburger::before, .hamburger::after {
            position: absolute;
            left: 0;
            content: "";
        }
        .hamburger::before { top: -5.5px; width: 13px; }
        .hamburger::after  { top:  5.5px; width: 10px; }
        /* Info button */
        .info-circle {
            display: grid;
            width: 20px;
            height: 20px;
            border: 1.5px solid currentColor;
            border-radius: 50%;
            place-items: center;
            font-family: var(--font-display);
            font-size: .76rem;
            font-weight: 700;
            line-height: 1;
            opacity: .7;
        }
        main {
            min-height: calc(var(--app-height) - 48px);
            padding: 16px
                max(14px, var(--safe-right))
                24px
                max(14px, var(--safe-left));
        }
        :host(:not([page="gallery"])) main {
            min-width: 0;
            min-height: 0;
            padding-top: 12px;
            padding-bottom: max(12px, var(--safe-bottom));
            overflow: hidden;
        }
        footer {
            padding: 10px 14px calc(12px + var(--safe-bottom));
            color: var(--ink-faint);
            font-size: .6rem;
            line-height: 1.55;
            text-align: center;
            border-top: 0.5px solid var(--separator);
        }
        footer a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        :host(:not([page="gallery"])) footer { display: none; }
        @media (max-width: 340px) {
            main { padding-inline: 10px; }
        }
    </style>
    <div class="layout">
        <header>
            <button class="icon-btn menu-btn" type="button"
                    aria-controls="offline-shell-drawer" aria-expanded="false">
                <span class="hamburger" aria-hidden="true"></span>
            </button>
            <h1></h1>
            <button class="icon-btn guide-btn" type="button" hidden>
                <span class="info-circle" aria-hidden="true">i</span>
            </button>
        </header>
        <main><slot></slot></main>
        <footer>
            <span class="copyright"></span><br>
            <a href="https://github.com/ylxdzsw/offline" rel="external noopener"></a>
        </footer>
    </div>
    <offline-drawer id="offline-shell-drawer"></offline-drawer>
    <offline-guide></offline-guide>
</template>
<script>
OfflineGames.games = [
    'xiangqi',
    'wuziqi',
    'go',
    'sudoku',
    '2048',
    'junqi',
    'chess',
    'reversi',
    'checkers',
    'backgammon',
    'huarong',
    'sliding',
    'nonogram',
    'minesweeper',
    'solitaire',
    'spider',
]

customElements.define('offline-shell', class extends HTMLElement {
    constructor() {
        super()
        this.attachShadow({mode: 'open'}).append(
            document.getElementById('offline-shell-template').content.cloneNode(true)
        )
    }

    async connectedCallback() {
        const page = this.getAttribute('page') || 'gallery'
        const gamePage = page !== 'gallery'
        document.documentElement.classList.toggle('game-page', gamePage)
        await Promise.all([
            customElements.whenDefined('offline-drawer'),
            customElements.whenDefined('offline-guide'),
        ])
        await new Promise(resolve => setTimeout(resolve, 0))
        if (!this.isConnected) return
        const {i18n, theme} = OfflineGames
        const s = this.shadowRoot

        /* Titles */
        const title = i18n.t(page === 'gallery' ? 'gallery' : page)
        s.querySelector('h1').textContent = title
        document.title = `${title} · ${i18n.t('siteName')}`
        s.querySelector('.copyright').textContent = i18n.t('copyright')
        s.querySelector('footer a').textContent = i18n.t('source')

        /* Buttons */
        const menuBtn = s.querySelector('.menu-btn')
        const guideBtn = s.querySelector('.guide-btn')
        menuBtn.setAttribute('aria-label', i18n.t('menu'))
        const layout = s.querySelector('.layout')

        /* Drawer */
        const drawer = s.querySelector('offline-drawer')
        drawer.setup({
            i18n,
            theme,
            games: OfflineGames.games,
            currentPage: page,
            layoutEl: layout,
            triggerEl: menuBtn,
        })
        menuBtn.addEventListener('click', () => drawer.open())

        /* Guide dialog */
        const guide = s.querySelector('offline-guide')
        guideBtn.setAttribute('aria-label', i18n.t('openGuide'))
        const hasGuide = guide.setup(i18n, page, this.getAttribute('guide'), guideBtn)
        if (hasGuide) {
            guideBtn.hidden = false
            guideBtn.addEventListener('click', () => guide.open())
        }

        if (gamePage) this.setupGameViewport(s.querySelector('main'))
    }

    setupGameViewport(main) {
        const setupGame = () => {
            const game = this.firstElementChild
            if (!game) return false

            this._fitChildObserver?.disconnect()
            this._fitChildObserver = null

            const schedule = () => {
                cancelAnimationFrame(this._fitFrame)
                this._fitFrame = requestAnimationFrame(() => this.fitGameSurface(main, game))
            }
            const setupSurface = () => {
                if (!this.isConnected || game !== this.firstElementChild) return
                const surface = game.shadowRoot?.querySelector('.board-wrap, .board, .table')
                if (!surface) {
                    this._fitInitFrame = requestAnimationFrame(setupSurface)
                    return
                }

                this._fitInitFrame = 0
                this._fitSurface = surface
                this._fitOriginal = {
                    marginBottom: surface.style.marginBottom,
                    transform: surface.style.transform,
                    transformOrigin: surface.style.transformOrigin,
                }
                this._fitObserver = new ResizeObserver(schedule)
                this._fitObserver.observe(main)
                for (const child of game.shadowRoot.children) {
                    if (child instanceof HTMLElement && child.tagName !== 'STYLE') {
                        this._fitObserver.observe(child)
                    }
                }
                window.addEventListener('resize', schedule)
                window.visualViewport?.addEventListener('resize', schedule)
                this._fitSchedule = schedule
                schedule()
            }

            customElements.whenDefined(game.localName).then(setupSurface)
            return true
        }

        if (setupGame()) return
        this._fitChildObserver = new MutationObserver(() => setupGame())
        this._fitChildObserver.observe(this, {childList: true})
    }

    fitGameSurface(main, game) {
        const surface = this._fitSurface
        if (!surface?.isConnected || !main.isConnected) return
        const original = this._fitOriginal
        surface.style.marginBottom = original.marginBottom
        surface.style.transform = original.transform
        surface.style.transformOrigin = original.transformOrigin

        const mainRect = main.getBoundingClientRect()
        const mainStyle = getComputedStyle(main)
        const gameRect = game.getBoundingClientRect()
        const surfaceRect = surface.getBoundingClientRect()
        const paddingBottom = parseFloat(mainStyle.paddingBottom) || 0
        const paddingLeft = parseFloat(mainStyle.paddingLeft) || 0
        const paddingRight = parseFloat(mainStyle.paddingRight) || 0
        const trailingHeight = Math.max(0, gameRect.bottom - surfaceRect.bottom)
        const availableHeight = mainRect.bottom - paddingBottom - surfaceRect.top - trailingHeight
        const availableWidth = mainRect.width - paddingLeft - paddingRight
        const scale = Math.max(0, Math.min(
            1,
            availableHeight / surfaceRect.height,
            availableWidth / surfaceRect.width
        ))

        surface.dataset.fitScale = scale.toFixed(4)
        if (scale >= .9999) return
        const marginBottom = parseFloat(getComputedStyle(surface).marginBottom) || 0
        const scaledWidth = surfaceRect.width * scale
        const targetLeft = mainRect.left + paddingLeft + (availableWidth - scaledWidth) / 2
        const translateX = targetLeft - surfaceRect.left
        surface.style.transformOrigin = 'top left'
        surface.style.transform = `translateX(${translateX}px) scale(${scale})`
        surface.style.marginBottom = `${marginBottom - surfaceRect.height * (1 - scale)}px`
    }

    disconnectedCallback() {
        cancelAnimationFrame(this._fitInitFrame)
        cancelAnimationFrame(this._fitFrame)
        this._fitChildObserver?.disconnect()
        this._fitObserver?.disconnect()
        if (this._fitSchedule) {
            window.removeEventListener('resize', this._fitSchedule)
            window.visualViewport?.removeEventListener('resize', this._fitSchedule)
        }
        if (this._fitSurface && this._fitOriginal) {
            this._fitSurface.style.marginBottom = this._fitOriginal.marginBottom
            this._fitSurface.style.transform = this._fitOriginal.transform
            this._fitSurface.style.transformOrigin = this._fitOriginal.transformOrigin
            delete this._fitSurface.dataset.fitScale
        }
        document.documentElement.classList.remove('game-page')
    }
})
</script>
