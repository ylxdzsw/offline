<style>
    .game-gallery { display: block; }
    .game-gallery .intro {
        margin: 0 2px 20px;
        color: var(--ink-muted);
        font-size: .92rem;
        line-height: 1.6;
        letter-spacing: -.005em;
    }
    .game-gallery .games { display: grid; gap: 10px; }
    .game-gallery article {
        display: grid;
        grid-template-columns: 90px 1fr;
        overflow: hidden;
        border-radius: var(--radius-md);
        background: var(--bg-surface);
        box-shadow: var(--shadow);
        /* iOS: shadow instead of border */
        transition: box-shadow .15s ease, transform .12s ease;
    }
    .game-gallery article:active { transform: scale(.99); }
    .game-gallery .preview {
        position: relative;
        display: grid;
        min-height: 110px;
        place-items: center;
        color: var(--ink);
        background: var(--bg-elevated);
    }
    /* Per-game preview tints */
    .game-gallery article[data-game="xiangqi"] .preview { color: var(--piece-red); background: color-mix(in srgb, var(--board-wood) 55%, var(--bg-elevated)); }
    .game-gallery article[data-game="wuziqi"]  .preview { color: var(--board-wood-line); background: color-mix(in srgb, var(--board-wood) 50%, var(--bg-elevated)); }
    .game-gallery article[data-game="sudoku"]  .preview { color: var(--ink); background: var(--board-paper); }
    .game-gallery article[data-game="2048"]    .preview { color: #776e65; background: color-mix(in srgb, #8f7a66 55%, var(--bg-elevated)); }
    .game-gallery article[data-game="junqi"]   .preview { color: var(--piece-red); background: color-mix(in srgb, var(--board-wood) 40%, var(--bg-elevated)); }
    .game-gallery article[data-game="chess"]   .preview { color: var(--ink); background: color-mix(in srgb, var(--board-dark) 35%, var(--bg-elevated)); }
    .game-gallery article[data-game="reversi"] .preview { color: var(--stone-white); background: color-mix(in srgb, var(--board-felt) 70%, var(--bg-elevated)); }
    .game-gallery article[data-game="checkers"] .preview { color: var(--piece-white); background: color-mix(in srgb, var(--board-dark) 48%, var(--bg-elevated)); }
    .game-gallery article[data-game="backgammon"] .preview { color: #f4e6cf; background: color-mix(in srgb, #a75c42 68%, var(--bg-elevated)); }
    .game-gallery article[data-game="huarong"] .preview { color: var(--piece-red); background: color-mix(in srgb, var(--board-wood) 62%, var(--bg-elevated)); }
    .game-gallery article[data-game="minesweeper"] .preview { color: var(--ink); background: color-mix(in srgb, var(--selected) 14%, var(--bg-elevated)); }
    .game-gallery article[data-game="solitaire"] .preview { color: #fff; background: color-mix(in srgb, #246449 78%, var(--bg-elevated)); }
    .game-gallery article[data-game="spider"] .preview { color: #fff; background: color-mix(in srgb, #174633 82%, var(--bg-elevated)); }
    /* Preview marks — unchanged */
    .game-gallery .xiangqi-mark {
        display: grid; width: 56px; height: 56px;
        border: 2px solid currentColor; border-radius: 50%;
        place-items: center;
        font-family: var(--font-display); font-size: 1.7rem; font-weight: 700;
        background: var(--piece-face);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 25%, transparent);
    }
    .game-gallery .gomoku-mark {
        position: relative; width: 62px; height: 62px;
        background-image: linear-gradient(var(--board-wood-line) 1px, transparent 1px),
                          linear-gradient(90deg, var(--board-wood-line) 1px, transparent 1px);
        background-size: 15.5px 15.5px;
        background-color: color-mix(in srgb, var(--board-wood) 70%, transparent);
        border-radius: 4px;
    }
    .game-gallery .gomoku-mark::before, .game-gallery .gomoku-mark::after {
        position: absolute; width: 16px; height: 16px; border-radius: 50%; content: "";
    }
    .game-gallery .gomoku-mark::before { top: 8px; left: 8px; background: radial-gradient(circle at 35% 30%, #4a4a48, var(--stone-black) 70%); }
    .game-gallery .gomoku-mark::after  { right: 8px; bottom: 8px; border: 1px solid var(--stone-white-edge); background: radial-gradient(circle at 35% 30%, #fff, var(--stone-white) 72%); }
    .game-gallery .sudoku-mark {
        display: grid; width: 58px; height: 58px;
        grid-template: repeat(3, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr));
        border: 2px solid var(--board-paper-box); background: var(--board-paper);
    }
    .game-gallery .sudoku-mark i {
        display: grid; min-width: 0; min-height: 0;
        border: 1px solid var(--board-paper-line); place-items: center;
        font-family: var(--font-display); font-size: .95rem; font-style: normal; font-weight: 700; color: var(--ink);
        line-height: 1;
    }
    .game-gallery .game2048-mark {
        display: grid; width: 64px; height: 64px; box-sizing: border-box;
        grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 5px;
        border-radius: 6px; background: #8f7a66;
    }
    .game-gallery .game2048-mark i {
        display: grid; min-width: 0; border-radius: 3px; place-items: center;
        color: #776e65; background: rgba(238, 228, 218, .35);
        font-family: var(--font-display); font-size: .52rem; font-style: normal; font-weight: 800;
    }
    .game-gallery .game2048-mark i[data-value="2"] { background: #eee4da; }
    .game-gallery .game2048-mark i[data-value="4"] { background: #ede0c8; }
    .game-gallery .game2048-mark i[data-value="8"] { color: #f9f6f2; background: #f2b179; }
    .game-gallery .game2048-mark i[data-value="16"] { color: #f9f6f2; background: #f59563; font-size: .45rem; }
    .game-gallery .junqi-mark {
        display: grid; width: 68px; height: 58px;
        grid-template-columns: repeat(3, 1fr); gap: 4px;
    }
    .game-gallery .junqi-mark i {
        display: grid; border: 1.5px solid currentColor; border-radius: 4px; place-items: center;
        font-family: var(--font-display); font-size: .62rem; font-style: normal; font-weight: 800;
        background: var(--piece-face); color: var(--piece-red);
    }
    .game-gallery .junqi-mark i:nth-child(n+4) { color: var(--piece-black); }
    .game-gallery .chess-mark {
        position: relative; display: grid; width: 58px; height: 58px;
        grid-template: repeat(2, 1fr) / repeat(2, 1fr);
        overflow: hidden; border: 2px solid var(--border-strong); border-radius: 4px;
    }
    .game-gallery .chess-mark i:nth-child(1), .game-gallery .chess-mark i:nth-child(4) { background: var(--board-dark); }
    .game-gallery .chess-mark i:nth-child(2), .game-gallery .chess-mark i:nth-child(3) { background: var(--board-light); }
    .game-gallery .chess-mark::after {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: var(--ink); content: "♘";
        font-family: var(--font-display); font-size: 2rem; font-weight: 700;
        text-shadow: 0 1px color-mix(in srgb, var(--bg-surface) 70%, transparent);
    }
    .game-gallery .reversi-mark {
        display: grid; width: 64px; height: 64px;
        grid-template-columns: repeat(4, 1fr); gap: 3px;
        padding: 5px;
        border: 2px solid var(--board-felt-edge); border-radius: 6px; background: var(--board-felt);
    }
    .game-gallery .reversi-mark i { border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .game-gallery .reversi-mark i:nth-child(1),.game-gallery .reversi-mark i:nth-child(4),
    .game-gallery .reversi-mark i:nth-child(6),.game-gallery .reversi-mark i:nth-child(11),
    .game-gallery .reversi-mark i:nth-child(13),.game-gallery .reversi-mark i:nth-child(16)
    { background: radial-gradient(circle at 35% 28%, #fff, var(--stone-white) 72%); }
    .game-gallery .reversi-mark i:not(:nth-child(1)):not(:nth-child(4)):not(:nth-child(6)):not(:nth-child(11)):not(:nth-child(13)):not(:nth-child(16))
    { background: radial-gradient(circle at 35% 28%, #555, var(--stone-black) 70%); }
    .game-gallery .checkers-mark {
        position: relative; width: 64px; height: 64px; overflow: hidden;
        border: 2px solid var(--border-strong); border-radius: 5px;
        background: conic-gradient(var(--board-light) 25%, var(--board-dark) 0 50%, var(--board-light) 0 75%, var(--board-dark) 0) 0 0 / 50% 50%;
    }
    .game-gallery .checkers-mark::before, .game-gallery .checkers-mark::after {
        position: absolute; width: 20px; height: 20px; border-radius: 50%; content: "";
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 2px 3px rgba(0,0,0,.34);
    }
    .game-gallery .checkers-mark::before {
        top: 7px; right: 7px; border: 1px solid #75241f;
        background: radial-gradient(circle at 35% 27%, #ed8b7f, #b73f38 70%);
    }
    .game-gallery .checkers-mark::after {
        bottom: 7px; left: 7px; border: 1px solid #090b0b;
        background: radial-gradient(circle at 35% 27%, #59605e, #111414 70%);
    }
    .game-gallery .backgammon-mark {
        position: relative; width: 68px; height: 54px; overflow: hidden;
        border: 3px solid #613628; border-radius: 5px; background: #b8734f;
        box-shadow: inset 0 0 8px rgba(47,20,12,.28);
    }
    .game-gallery .backgammon-mark::before, .game-gallery .backgammon-mark::after {
        position: absolute; right: 4px; left: 4px; height: 43%; content: "";
        background: repeating-conic-gradient(from 153deg at 8.333% 0, #e7ba78 0 27deg, #7d3931 28deg 55deg, transparent 56deg 60deg);
    }
    .game-gallery .backgammon-mark::before { top: 0; }
    .game-gallery .backgammon-mark::after { bottom: 0; transform: rotate(180deg); }
    .game-gallery .backgammon-mark i {
        position: absolute; z-index: 2; width: 12px; height: 12px; border-radius: 50%;
        box-shadow: 0 1px 2px rgba(30,12,8,.42);
    }
    .game-gallery .backgammon-mark i:nth-child(1), .game-gallery .backgammon-mark i:nth-child(2) {
        top: 2px; right: 5px; border: 1px solid #8d826e; background: #efe5cf;
    }
    .game-gallery .backgammon-mark i:nth-child(2) { top: 12px; }
    .game-gallery .backgammon-mark i:nth-child(3), .game-gallery .backgammon-mark i:nth-child(4) {
        bottom: 2px; left: 5px; border: 1px solid #221c1a; background: #342c29;
    }
    .game-gallery .backgammon-mark i:nth-child(4) { bottom: 12px; }
    .game-gallery .backgammon-mark i:nth-child(5) {
        top: 20px; left: 27px; width: 10px; height: 10px; border: 1px solid #7f735e;
        border-radius: 3px; background: #f1e6cc;
    }
    .game-gallery .huarong-mark {
        position: relative; width: 52px; height: 64px; border: 2px solid var(--board-wood-edge);
        border-radius: 5px; background: var(--board-wood); box-shadow: inset 0 0 8px rgba(60,35,15,.16);
    }
    .game-gallery .huarong-mark i { position: absolute; border: 1px solid currentColor; border-radius: 3px; background: var(--piece-face); }
    .game-gallery .huarong-mark .cao { top: 3px; left: 14px; width: 20px; height: 22px; color: #8f2c26; background: #bd4a3f; }
    .game-gallery .huarong-mark .guan { top: 28px; left: 14px; width: 20px; height: 10px; color: #6f5420; background: #987129; }
    .game-gallery .huarong-mark .g1 { top: 3px; left: 3px; width: 9px; height: 22px; }
    .game-gallery .huarong-mark .g2 { top: 3px; right: 3px; width: 9px; height: 22px; }
    .game-gallery .huarong-mark .g3 { top: 28px; left: 3px; width: 9px; height: 22px; }
    .game-gallery .huarong-mark .g4 { top: 28px; right: 3px; width: 9px; height: 22px; }
    .game-gallery .huarong-mark .s1 { top: 41px; left: 14px; width: 9px; height: 9px; }
    .game-gallery .huarong-mark .s2 { top: 41px; left: 25px; width: 9px; height: 9px; }
    .game-gallery .huarong-mark .s3 { bottom: 3px; left: 3px; width: 9px; height: 9px; }
    .game-gallery .huarong-mark .s4 { right: 3px; bottom: 3px; width: 9px; height: 9px; }
    .game-gallery .minesweeper-mark {
        display: grid; width: 62px; height: 62px; box-sizing: border-box;
        grid-template: repeat(4, minmax(0, 1fr)) / repeat(4, minmax(0, 1fr));
        gap: 2px; padding: 3px;
        border: 1px solid var(--border-strong); border-radius: 6px;
        background: var(--border);
    }
    .game-gallery .minesweeper-mark i {
        display: grid; min-width: 0; min-height: 0;
        border-radius: 2px; place-items: center;
        color: var(--ink); background: var(--board-paper);
        font-family: var(--font-mono); font-size: .62rem; font-style: normal; font-weight: 850;
        line-height: 1;
    }
    .game-gallery .minesweeper-mark i.covered {
        background: linear-gradient(145deg, var(--bg-surface), var(--bg-muted));
        box-shadow: inset 1px 1px rgba(255,255,255,.4), inset -1px -1px rgba(0,0,0,.12);
    }
    .game-gallery .minesweeper-mark i.one { color: #2567a8; }
    .game-gallery .minesweeper-mark i.two { color: #31713d; }
    .game-gallery .minesweeper-mark i.flag { color: var(--danger); }
    .game-gallery .solitaire-mark {
        position: relative; width: 66px; height: 64px;
    }
    .game-gallery .solitaire-mark i {
        position: absolute; display: grid; width: 31px; height: 43px; box-sizing: border-box;
        border: 1px solid rgba(20,25,23,.55); border-radius: 4px; place-items: center;
        color: #161918; background: #faf8f2; box-shadow: 0 2px 4px rgba(0,0,0,.28);
        font: 800 1.05rem/1 Georgia, serif;
    }
    .game-gallery .solitaire-mark i:nth-child(1) {
        top: 2px; left: 5px; transform: rotate(-12deg); color: #c52d32;
    }
    .game-gallery .solitaire-mark i:nth-child(2) {
        top: 8px; left: 20px; transform: rotate(2deg);
    }
    .game-gallery .solitaire-mark i:nth-child(3) {
        top: 15px; left: 34px; transform: rotate(13deg); color: #c52d32;
    }
    .game-gallery .spider-mark {
        position: relative; width: 66px; height: 66px;
    }
    .game-gallery .spider-mark i {
        position: absolute; display: grid; width: 29px; height: 40px; box-sizing: border-box;
        border: 1px solid rgba(20,25,23,.55); border-radius: 4px; place-items: start center;
        padding-top: 5px; color: #161918; background: #faf8f2;
        box-shadow: 0 2px 4px rgba(0,0,0,.28); font: 800 .76rem/1 Georgia, serif;
    }
    .game-gallery .spider-mark i:nth-child(1) { top: 2px; left: 4px; }
    .game-gallery .spider-mark i:nth-child(2) { top: 9px; left: 20px; color: #c52d32; }
    .game-gallery .spider-mark i:nth-child(3) { top: 16px; left: 36px; }
    .game-gallery .spider-mark::after {
        position: absolute; right: 0; bottom: 0; display: grid; width: 25px; height: 25px;
        border: 1px solid rgba(255,255,255,.52); border-radius: 50%; place-items: center;
        color: #fff; background: #174633; content: "8";
        font: 800 .68rem/1 var(--font-mono);
    }
    /* Card content */
    .game-gallery .content {
        display: grid;
        align-content: center;
        gap: 5px;
        padding: 14px 14px 16px;
        min-width: 0;
    }
    .game-gallery h2 {
        margin: 0;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -.015em;
    }
    .game-gallery p {
        margin: 0 0 8px;
        color: var(--ink-muted);
        font-size: .8rem;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .game-gallery a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 34px;
        padding: 0 16px;
        border-radius: var(--radius-xl);
        background: var(--accent);
        color: var(--accent-ink);
        font-size: .84rem;
        font-weight: 600;
        letter-spacing: -.01em;
        text-decoration: none;
        transition: filter .12s ease;
    }
    .game-gallery a:active { filter: brightness(.92); }
    @media (max-width: 340px) {
        .game-gallery article { grid-template-columns: 76px 1fr; }
        .game-gallery .preview { min-height: 96px; }
        .game-gallery h2 { font-size: .98rem; }
    }
</style>

<script>
(() => {
    const render = () => {
        const root = document.querySelector('.game-gallery')
        if (!root) return
        if (!root.querySelector('.intro')) {
            root.replaceChildren(
                Object.assign(document.createElement('p'), {className: 'intro'}),
                Object.assign(document.createElement('div'), {className: 'games'}),
            )
        }
        const {i18n, storage} = OfflineGames
        root.querySelector('.intro').textContent = i18n.locale === 'zh'
            ? '无需联网。选一款经典游戏，随时开局。'
            : 'No connection needed. Pick a classic and play anywhere.'
        const marks = {
            xiangqi: '<span class="xiangqi-mark">棋</span>',
            wuziqi:  '<span class="gomoku-mark"></span>',
            sudoku:  '<span class="sudoku-mark"><i>8</i><i></i><i>2</i><i></i><i>5</i><i></i><i>1</i><i></i><i>9</i></span>',
            '2048':  '<span class="game2048-mark"><i></i><i data-value="2">2</i><i></i><i data-value="4">4</i><i data-value="2">2</i><i></i><i data-value="8">8</i><i></i><i></i><i data-value="4">4</i><i></i><i></i><i data-value="16">16</i><i></i><i></i><i></i></span>',
            junqi:   '<span class="junqi-mark"><i>司</i><i>旗</i><i>工</i><i>弹</i><i>师</i><i>雷</i></span>',
            chess:   '<span class="chess-mark"><i></i><i></i><i></i><i></i></span>',
            reversi: '<span class="reversi-mark">' + '<i></i>'.repeat(16) + '</span>',
            checkers: '<span class="checkers-mark"></span>',
            backgammon: '<span class="backgammon-mark"><i></i><i></i><i></i><i></i><i></i></span>',
            huarong: '<span class="huarong-mark"><i class="cao"></i><i class="guan"></i><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i></span>',
            minesweeper: '<span class="minesweeper-mark"><i></i><i class="one">1</i><i class="covered"></i><i class="covered"></i><i></i><i class="one">1</i><i class="two">2</i><i class="covered flag">⚑</i><i></i><i></i><i class="one">1</i><i class="covered"></i><i></i><i></i><i class="one">1</i><i class="covered"></i></span>',
            solitaire: '<span class="solitaire-mark"><i>♥</i><i>♣</i><i>♦</i></span>',
            spider: '<span class="spider-mark"><i>K♠</i><i>Q♥</i><i>J♣</i></span>',
        }
        root.querySelector('.games').innerHTML = OfflineGames.games.map(game => `
            <article data-game="${game}">
                <div class="preview">${marks[game] || ''}</div>
                <div class="content">
                    <h2>${i18n.t(game)}</h2>
                    <p>${i18n.t(game + 'Desc')}</p>
                    <a href="./${game}.html">${i18n.t(storage.hasProgress(game) ? 'continue' : 'play')}</a>
                </div>
            </article>
        `).join('')
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render, {once: true})
    else render()
})()
</script>
