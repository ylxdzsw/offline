<template id="junqi-game-template">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :host { display: block; color: var(--ink); }
        .toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; margin-bottom: 10px; }
        label { display: grid; gap: 3px; color: var(--ink-muted); font-size: .7rem; font-weight: 600; letter-spacing: .02em; }
        select, button {
            min-height: var(--control-h, 42px); border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm); color: var(--ink); background: var(--bg-surface);
        }
        select { min-width: 96px; padding: 0 28px 0 10px; }
        button { padding: 0 12px; font-weight: 650; touch-action: manipulation; }
        button:disabled { opacity: .42; }
        .status {
            display: flex; min-height: 40px; align-items: center; justify-content: center;
            margin: 0 0 9px; padding: 4px 10px; border-radius: var(--radius-sm);
            color: var(--status-ink); font-size: .88rem; font-weight: 700; text-align: center; background: var(--status-bg);
        }
        .status.thinking::after {
            width: 5px; height: 5px; margin-left: 7px; border-radius: 50%; content: "";
            background: currentColor; animation: pulse .8s ease-in-out infinite alternate;
        }
        @keyframes pulse { to { opacity: .2; transform: scale(.7); } }
        .warning { margin: 0 0 9px; color: var(--danger); font-size: .77rem; text-align: center; }
        .warning[hidden] { display: none; }
        .placement-note {
            margin: -2px 0 9px; color: var(--ink-muted); font-size: .72rem;
            line-height: 1.35; text-align: center;
        }
        .placement-note[hidden] { display: none; }
        .board {
            position: relative; display: grid; width: 100%; aspect-ratio: 5 / 7.35;
            grid-template: repeat(12, 1fr) / repeat(5, 1fr); overflow: hidden;
            border: 2px solid var(--board-wood-edge); border-radius: var(--radius-md);
            background: var(--board-wood);
            box-shadow: inset 0 0 28px color-mix(in srgb, var(--board-wood-line) 14%, transparent), var(--shadow-soft);
            user-select: none;
        }
        .board[data-win]::after {
            position: absolute; z-index: 8; top: 48%; left: 50%; width: 58%; padding: 9px 10px;
            border: 2px solid #78241f; border-radius: 5px; content: attr(data-win); color: #fff8dd;
            background: color-mix(in srgb, var(--piece-red) 92%, transparent);
            box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 5px 16px rgba(70,25,15,.3);
            font-family: var(--font-display); font-size: clamp(.76rem, 3.7vw, 1rem);
            font-weight: 850; text-align: center; transform: translate(-50%, -50%); pointer-events: none;
        }
        .square { position: relative; display: grid; min-width: 0; min-height: 0; padding: 3px; border: 0; border-radius: 0; place-items: center; background: transparent; }
        .routes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .routes path { fill: none; stroke: var(--board-wood-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
        .routes .rail { stroke-width: 5; }
        .routes .rail-inner { stroke: var(--board-wood); stroke-width: 2; }
        .square::before { position: absolute; z-index: 0; }
        .square.camp::before, .square.hq::before, .square.legal::before, .square.capture::before { content: ""; }
        .square.swap .piece { outline: 2px dashed var(--legal); outline-offset: 2px; }
        .square:focus-visible { outline: 3px solid var(--selected); outline-offset: -3px; z-index: 4; }
        .square.camp::before {
            width: 54%; height: 54%; border: 1px solid var(--board-wood-line); transform: rotate(45deg);
            background: color-mix(in srgb, var(--piece-face) 70%, var(--board-wood));
        }
        .square.hq::before {
            width: 72%; height: 62%; border: 2px double var(--board-wood-line);
            background: color-mix(in srgb, var(--piece-face) 75%, transparent);
        }
        .square.legal::before { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--legal); }
        .square.capture::before { z-index: 3; width: 94%; height: 86%; border: 3px solid var(--capture); border-radius: 10px; background: transparent; pointer-events: none; }
        .piece {
            position: relative; z-index: 2; display: grid; width: min(88%, 58px); height: min(80%, 37px);
            border: 2px solid currentColor; border-radius: 7px; place-items: center;
            font-family: var(--font-display); font-size: clamp(.69rem, 3vw, .9rem); font-weight: 800; line-height: 1;
            background: var(--piece-face); box-shadow: 0 2px 3px rgba(0, 0, 0, .22);
        }
        .piece.red { color: var(--piece-red); }
        .piece.black { color: var(--piece-black); }
        .piece.hidden {
            color: color-mix(in srgb, var(--ink) 55%, var(--board-wood-line));
            background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--board-wood-line) 70%, transparent) 0 4px, color-mix(in srgb, var(--board-wood) 70%, var(--piece-face)) 4px 8px);
        }
        .square.setup-zone { background: color-mix(in srgb, var(--piece-red) 5%, transparent); }
        .square.selected .piece { outline: 3px solid var(--selected); outline-offset: 1px; transform: translateY(-1px); }
        .square.last { background: color-mix(in srgb, var(--status-bg) 55%, transparent); }
        .square.last-to { animation: junqi-target .24s ease-out; }
        .square.last-to .piece { animation: junqi-piece .22s ease-out; }
        @keyframes junqi-target { from { box-shadow: inset 0 0 0 4px var(--selected); } }
        @keyframes junqi-piece { from { opacity: .4; transform: scale(.72); } }
        .legend { display: flex; justify-content: center; gap: 18px; margin-top: 8px; color: var(--ink-muted); font-size: .7rem; }
        .legend span::before { display: inline-block; width: 9px; height: 9px; margin-right: 4px; border-radius: 50%; content: ""; background: var(--piece-red); }
        .legend span:last-child::before { background: var(--piece-black); }
        @media (prefers-reduced-motion: reduce) {
            .status.thinking::after, .square.last-to, .square.last-to .piece { animation: none; }
        }
        @media (max-width: 340px) { .toolbar { gap: 4px; } button { padding-inline: 8px; font-size: .82rem; } select { min-width: 86px; } .piece { border-width: 1px; } }
        .retry { width: 100%; min-height: var(--control-h,42px); margin: 0 0 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--ink); background: var(--bg-surface); font-weight: 650; }
        .retry[hidden] { display: none; }
    </style>
    <div class="toolbar">
        <label><span class="difficulty-label"></span><select class="difficulty"><option value="easy"></option><option value="medium"></option><option value="hard"></option></select></label>
        <button class="undo" type="button"></button><button class="new" type="button"></button>
    </div>
    <p class="warning" hidden></p>
    <div class="status" role="status" aria-live="polite"></div><button class="retry" type="button" hidden></button>
    <p class="placement-note" hidden></p>
    <div class="board" role="grid"></div>
    <div class="legend"><span class="your-side"></span><span class="enemy-side"></span></div>
</template>

<script>
const JUNQI_MIN_AI_TURN_MS = 360

OfflineGames.wasm.defineElement('junqi', 'junqi-game', class extends HTMLElement {
    constructor() {
        super(); this.attachShadow({mode: 'open'}).append(document.getElementById('junqi-game-template').content.cloneNode(true))
        this.selected = null; this.setupError = false; this.thinking = false; this.worker = null; this.aiTimer = null; this.aiStartedAt = 0; this.requestId = 0
    }
    connectedCallback() {
        this.engine = OfflineGames.Junqi; this.i18n = OfflineGames.i18n; this.storage = OfflineGames.storage
        this.routes = this.boardRoutes(); this.load(); this.bind(); this.localize(); this.render()
        if (this.state.phase === 'playing' && this.state.turn === this.engine.BLACK && !this.state.outcome) this.requestAI()
    }
    disconnectedCallback() { this.cancelAI() }
    fresh(difficulty = 'medium') { const seed=OfflineGames.runtime.randomSeed();return {schema: 1, game: 'junqi', seed, difficulty, phase: 'placement', board: this.engine.initialBoard(seed), turn: this.engine.RED, revealed: [], history: [], lastMove: null, message: null, outcome: null} }
    valid(saved) { return saved && Array.isArray(saved.board) && saved.board.length === 60 && [this.engine.RED,this.engine.BLACK].includes(saved.turn) && ['easy','medium','hard'].includes(saved.difficulty) && (!saved.phase||['placement','playing'].includes(saved.phase)) && Array.isArray(saved.revealed) && Array.isArray(saved.history) }
    publicReveals(board, revealed) { const flags=new Set(board.flatMap(piece=>piece?.type===this.engine.FLAG?[piece.id]:[]));return revealed.filter(id=>flags.has(id)) }
    normalizeReveals(state) { state.revealed=this.publicReveals(state.board,state.revealed);for(const snapshot of state.history)if(Array.isArray(snapshot.board)&&Array.isArray(snapshot.revealed))snapshot.revealed=this.publicReveals(snapshot.board,snapshot.revealed) }
    load() { const saved = this.storage.read('junqi'); this.state = this.valid(saved) ? saved : this.fresh();this.normalizeReveals(this.state);if(!this.state.phase)this.state.phase='playing';if(!Number.isInteger(this.state.seed))this.state.seed=OfflineGames.runtime.randomSeed() }
    bind() {
        this.bindBoardKeys()
        const s = this.shadowRoot
        s.querySelector('.board').addEventListener('click', event => { const square = event.target.closest('.square'); if (square) this.tap(Number(square.dataset.index)) })
        s.querySelector('.undo').addEventListener('click', () => this.state.phase === 'placement' ? this.shuffleSetup() : this.undo())
        s.querySelector('.new').addEventListener('click', () => this.state.phase === 'placement' ? this.startBattle() : this.newGame())
        s.querySelector('.difficulty').addEventListener('change', event => { this.state.difficulty = event.target.value; this.save() })
    }
    localize() {
        const s = this.shadowRoot, t = key => this.i18n.t(key)
        s.querySelector('.difficulty-label').textContent = t('difficulty'); for (const option of s.querySelectorAll('option')) option.textContent = t(option.value)
        s.querySelector('.warning').textContent = t('storageWarning'); s.querySelector('.placement-note').textContent = t('junqiPlacementRules')
        s.querySelector('.your-side').textContent = t('junqiYourSide'); s.querySelector('.enemy-side').textContent = t('junqiEnemySide')
    }
    save() { if (!this.storage.write('junqi', this.state)) this.shadowRoot.querySelector('.warning').hidden = false }
    tap(index) {
        if (this.thinking || this.state.outcome || this.state.turn !== this.engine.RED) return
        if (this.state.phase === 'placement') { this.place(index); return }
        const value = this.state.board[index]
        if (value?.side === this.engine.RED) { this.selected = this.selected !== index && this.engine.movesFor(this.state.board,index).length ? index : null; this.render(); return }
        if (this.selected != null && this.engine.movesFor(this.state.board,this.selected).some(move => move.to === index)) this.commit({from:this.selected,to:index}, this.engine.RED)
        else { this.selected = null; this.render() }
    }
    place(index) {
        const value = this.state.board[index]
        if (value?.side !== this.engine.RED) return
        this.setupError = false
        if (this.selected == null) { this.selected = index; this.render(); return }
        if (this.selected === index) { this.selected = null; this.render(); return }
        const board = this.state.board.slice()
        ;[board[this.selected],board[index]]=[board[index],board[this.selected]]
        if (!this.engine.validateSetup(board,this.engine.RED)) { this.setupError = true; this.render(); return }
        this.state.board = board; this.selected = null; this.save(); this.render()
    }
    shuffleSetup() {
        const difficulty=this.state.difficulty; this.cancelAI(); this.state=this.fresh(difficulty); this.selected=null; this.setupError=false; this.save(); this.render()
    }
    startBattle() {
        if (!this.engine.validateSetup(this.state.board,this.engine.RED)) { this.setupError=true; this.render(); return }
        this.state.phase='playing'; this.state.turn=this.engine.RED; this.selected=null; this.setupError=false; this.save(); this.render()
    }
    snapshot(mover) { return {mover, board:this.state.board, turn:this.state.turn, revealed:this.state.revealed, lastMove:this.state.lastMove, message:this.state.message, outcome:this.state.outcome} }
    maskedBoard(board, side, aliases, revealed = []) {
        const publicFlags = new Set(revealed)
        return board.map(piece => {
            if (!piece || piece.side === side) return piece
            return {id:aliases.get(piece.id),side:piece.side,type:publicFlags.has(piece.id)?this.engine.FLAG:'?'}
        })
    }
    aiKnowledge(side) {
        const history = this.state.history
        const initial = history[0]?.board || this.state.board
        const aliases = new Map()
        for (const board of [initial,...history.map(snapshot=>snapshot.board),this.state.board])
            for (const piece of board) if (piece && piece.side !== side && !aliases.has(piece.id)) aliases.set(piece.id,`e${aliases.size}`)
        const publicId = id => aliases.get(id) || id
        const events = history.map((before,index) => {
            const after = history[index + 1] || this.state
            const move = after.lastMove
            if (!move) return null
            const attacker = before.board[move.from]
            const defender = before.board[move.to]
            const previouslyRevealed = new Set(before.revealed || [])
            return {
                side: before.mover,
                move,
                attacker: attacker ? publicId(attacker.id) : null,
                defender: defender ? publicId(defender.id) : null,
                result: defender ? after.message : 'move',
                revealed: (after.revealed || []).filter(id => !previouslyRevealed.has(id)).map(publicId),
            }
        }).filter(event => event?.attacker)
        return {
            board: this.maskedBoard(this.state.board,side,aliases,this.state.revealed),
            initialBoard: this.maskedBoard(initial,side,aliases),
            events,
            revealed: this.state.revealed.map(publicId),
        }
    }
    commit(move, side) {
        this.state.history.push(this.snapshot(side))
        const result = this.engine.applyMove(this.state.board,move)
        this.state.board = result.board; this.state.revealed = [...new Set([...this.state.revealed,...result.revealed])]
        this.state.turn = this.engine.other(side); this.state.lastMove = move; this.state.message = result.defender ? result.result : null; this.selected = null
        const outcome = this.engine.status(this.state.board,this.state.turn); this.state.outcome = outcome.ended ? outcome : null
        this.save(); this.render(); if (!this.state.outcome && this.state.turn === this.engine.BLACK) this.requestAI()
    }
    requestAI() {
        this.cancelAI(); this.thinking = true; this.aiStartedAt = performance.now(); const id = ++this.requestId
        try { this.worker = OfflineGames.runtime.createWorker('junqi-worker-payload') } catch (error) { this.failAI(error); return }
        this.worker.onmessage = event => {
            if (event.data.id !== id || !this.thinking) return
            const move = event.data.move
            const valid = move && this.engine.legalMoves(this.state.board,this.engine.BLACK).some(candidate => candidate.from === move.from && candidate.to === move.to)
            if (this.worker) this.worker.terminate()
            this.worker = null
            const delay = Math.max(0, JUNQI_MIN_AI_TURN_MS - (performance.now() - this.aiStartedAt))
            this.aiTimer = setTimeout(() => {
                this.aiTimer = null
                if (id !== this.requestId || !this.thinking) return
                this.thinking = false
                if (valid) this.commit(move,this.engine.BLACK)
                else this.failAI()
            }, delay)
        }
        this.worker.onerror = error => this.failAI(error)
        this.worker.postMessage({id,...this.aiKnowledge(this.engine.BLACK),side:this.engine.BLACK,difficulty:this.state.difficulty,seed:OfflineGames.runtime.moveSeed(this.state.seed,this.state.history.length)}); this.render()
    }
    cancelAI(invalidate=true) { this.aiFailed=false; if (invalidate) this.requestId++; if (this.worker) this.worker.terminate(); if (this.aiTimer) clearTimeout(this.aiTimer); this.worker=null; this.aiTimer=null; this.thinking=false }
    undo() {
        if (!this.state.history.length) return
        const wasThinking = this.thinking; this.cancelAI(); let count = wasThinking || this.state.history.at(-1).mover === this.engine.RED ? 1 : 2; let previous
        while (count-- > 0 && this.state.history.length) previous = this.state.history.pop()
        if (previous) Object.assign(this.state,{board:previous.board,turn:previous.turn,revealed:previous.revealed,lastMove:previous.lastMove,message:previous.message,outcome:previous.outcome})
        this.selected=null; this.save(); this.render()
    }
    newGame() { if (this.state.history.length && !confirm(this.i18n.t('confirmNew'))) return; const difficulty=this.state.difficulty; this.cancelAI(); this.state=this.fresh(difficulty); this.selected=null; this.setupError=false; this.save(); this.render() }
    pieceLabel(value, visible) { return visible ? this.i18n.t('junqiPiece'+value.type) : '◆' }
    statusText() {
        if (this.aiFailed) return this.i18n.t('aiUnavailable')
        if (this.state.phase === 'placement') {
            if (this.setupError) return this.i18n.t('junqiInvalidSwap')
            return this.i18n.t(this.selected == null ? 'junqiArrange' : 'junqiChooseSwap')
        }
        if (this.state.outcome) return this.i18n.t(this.state.outcome.winner === this.engine.RED ? 'youWin' : 'aiWins')
        if (this.thinking || this.state.turn === this.engine.BLACK) return this.i18n.t('aiThinking')
        if (this.state.message) return this.i18n.t('junqiBattle'+this.state.message[0].toUpperCase()+this.state.message.slice(1))
        return this.i18n.t('yourTurn')
    }
    boardRoutes() {
        const roads = [], rails = [], e = this.engine
        for (let from = 0; from < 60; from++) {
            const railway = e.isRail(from) ? new Set(e.railwayNeighbors(from)) : new Set()
            for (const to of e.roadNeighbors(from)) {
                if (to <= from) continue
                const path = `M${e.columnOf(from)+.5} ${e.rowOf(from)+.5}L${e.columnOf(to)+.5} ${e.rowOf(to)+.5}`
                ;(railway.has(to) ? rails : roads).push(path)
            }
        }
        return `<svg class="routes" viewBox="0 0 5 12" preserveAspectRatio="none" aria-hidden="true"><path d="${roads.join(' ')}"/><path class="rail" d="${rails.join(' ')}"/><path class="rail-inner" d="${rails.join(' ')}"/></svg>`
    }
    setupTargets() {
        if (this.selected == null) return []
        return this.state.board.flatMap((piece, index) => {
            if (index === this.selected || piece?.side !== this.engine.RED) return []
            const board = this.state.board.slice()
            ;[board[this.selected], board[index]] = [board[index], board[this.selected]]
            return this.engine.validateSetup(board, this.engine.RED) ? [{to: index}] : []
        })
    }
    failAI(error) {
        if (error) console.error(error)
        this.cancelAI(); this.aiFailed = true; this.render()
    }
    bindBoardKeys() {
        this.shadowRoot.querySelector('.retry').addEventListener('click', () => this.requestAI())
        const board = this.shadowRoot.querySelector('.board')
        board.addEventListener('focusin', event => {
            const cell = event.target.closest('.square')
            if (!cell) return
            this.focusIndex = Number(cell.dataset.index)
            for (const button of board.querySelectorAll('.square')) button.tabIndex = button === cell ? 0 : -1
        })
        board.addEventListener('keydown', event => {
            const cell = event.target.closest('.square')
            if (!cell) return
            const index = Number(cell.dataset.index), row = Math.floor(index / 5), column = index % 5, direction = 1
            const step = {ArrowUp: [-direction, 0], ArrowDown: [direction, 0], ArrowLeft: [0, -direction], ArrowRight: [0, direction]}[event.key]
            if (event.key === 'Escape') { event.preventDefault(); this.selected=null;this.setupError=false; this.render(); return }
            if (!step) return
            event.preventDefault()
            const nextRow = Math.max(0, Math.min(11, row + step[0])), nextColumn = Math.max(0, Math.min(4, column + step[1]))
            board.querySelector(`[data-index="${nextRow * 5 + nextColumn}"]`).focus()
        })
    }
    restoreBoardFocus(focused) {
        const retry = this.shadowRoot.querySelector('.retry')
        retry.hidden = !this.aiFailed; retry.textContent = this.i18n.t('retry')
        this.focusIndex ??= 30
        for (const button of this.shadowRoot.querySelectorAll('.square')) button.tabIndex = Number(button.dataset.index) === this.focusIndex ? 0 : -1
        if (focused != null) this.shadowRoot.querySelector(`.square[data-index="${focused}"]`)?.focus({preventScroll: true})
    }
    render() {
        const focused = this.shadowRoot.activeElement?.dataset.index
        const s=this.shadowRoot, legal=this.state.phase==='placement'?this.setupTargets():this.selected==null?[]:this.engine.movesFor(this.state.board,this.selected), targets=new Map(legal.map(move=>[move.to,Boolean(this.state.board[move.to])])), revealed=new Set(this.state.revealed)
        const squares=this.state.board.map((value,index)=>{
            const row=this.engine.rowOf(index), column=this.engine.columnOf(index), classes=['square']
            if (this.engine.isCamp(index)) classes.push('camp'); if (this.engine.isHQ(index)) classes.push('hq'); if (index===this.selected) classes.push('selected')
            if (this.state.phase==='placement'&&value?.side===this.engine.RED) classes.push('setup-zone')
            if (targets.has(index)) classes.push(this.state.phase==='placement'?'swap':targets.get(index)?'capture':'legal'); if (this.state.lastMove&&(index===this.state.lastMove.from||index===this.state.lastMove.to)) classes.push('last'); if (this.state.lastMove?.to===index) classes.push('last-to')
            const visible=value&&(value.side===this.engine.RED||revealed.has(value.id)||this.state.outcome)
            const token=value?`<span class="piece ${value.side===this.engine.RED?'red':'black'} ${visible?'':'hidden'}">${this.pieceLabel(value,visible)}</span>`:''
            const name=value?(visible?`${this.i18n.t(value.side===this.engine.RED?'red':'black')} ${this.i18n.t('junqiPiece'+value.type)}`:this.i18n.t('hiddenPiece')):this.i18n.t('empty')
            const last=this.state.lastMove&&(index===this.state.lastMove.from||index===this.state.lastMove.to)?`, ${this.i18n.t('lastMove')}`:''
            return `<button type="button" role="gridcell" class="${classes.join(' ')}" data-index="${index}" aria-label="${name}, ${this.i18n.t('row')} ${row+1}, ${this.i18n.t('column')} ${column+1}${last}${index===this.selected?', '+this.i18n.t('selected'):''}${targets.has(index)?', '+this.i18n.t('legalMove'):''}">${token}</button>`
        }).join('')
        const board=s.querySelector('.board'); board.innerHTML=this.routes+squares; const status=s.querySelector('.status'); status.textContent=this.statusText(); status.classList.toggle('thinking',this.thinking)
        if(this.state.outcome?.winner===this.engine.RED)board.dataset.win=this.i18n.t('youWin');else delete board.dataset.win
        board.setAttribute('aria-disabled', String(this.thinking || this.state.turn !== this.engine.RED || Boolean(this.state.outcome)))
        const placement=this.state.phase==='placement', undo=s.querySelector('.undo'), next=s.querySelector('.new')
        s.querySelector('.placement-note').hidden=!placement; s.querySelector('.difficulty').value=this.state.difficulty
        undo.textContent=this.i18n.t(placement?'junqiShuffle':'undo'); undo.disabled=!placement&&!this.state.history.length
        next.textContent=this.i18n.t(placement?'junqiStartBattle':'newGame')
        this.restoreBoardFocus(focused)
    }
})
</script>
