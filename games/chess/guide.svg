    <rect x="30" y="76" width="224" height="336" fill="url(#board)" stroke="#6d6456" stroke-width="3"/>
    <g filter="url(#shadow)">
      <circle cx="114" cy="216" r="23" fill="#f7f4ec" stroke="#2a2622" stroke-width="3"/><text x="114" y="226" text-anchor="middle" font-size="28" font-weight="800" font-family="Georgia,serif">P</text>
      <circle cx="170" cy="216" r="23" fill="#242725"/><text x="170" y="226" text-anchor="middle" font-size="28" font-weight="800" fill="#f7f4ec" font-family="Georgia,serif">P</text>
