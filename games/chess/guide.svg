      <g filter="url(#shadow)"><circle cx="28" cy="84" r="23" fill="#f7f4ec" stroke="#2a2622" stroke-width="3"/><circle cx="196" cy="84" r="23" fill="#f7f4ec" stroke="#2a2622" stroke-width="3"/></g>
      <text x="28" y="94" text-anchor="middle" font-size="28" font-weight="800" font-family="Georgia,serif">K</text><text x="196" y="94" text-anchor="middle" font-size="28" font-weight="800" font-family="Georgia,serif">R</text>
      <path d="M61 47h96" stroke="#2d6357" stroke-width="7" marker-end="url(#arrow)"/>
    </g>
    <path d="M143 225v42" stroke="#2d6357" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(31 298)">
      <rect width="224" height="112" fill="url(#board)" stroke="#6d6456" stroke-width="3"/>
      <g filter="url(#shadow)"><circle cx="140" cy="84" r="23" fill="#f7f4ec" stroke="#2a2622" stroke-width="3"/><circle cx="84" cy="84" r="23" fill="#f7f4ec" stroke="#2a2622" stroke-width="3"/></g>
      <text x="140" y="94" text-anchor="middle" font-size="28" font-weight="800" font-family="Georgia,serif">K</text><text x="84" y="94" text-anchor="middle" font-size="28" font-weight="800" font-family="Georgia,serif">R</text>
    </g>
  </g>
  <g transform="translate(650 28)">
