<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sliding puzzle board sizes</title>
  <desc id="desc">Three by three, four by four, and five by five numbered sliding boards. The four by four board is labeled as the classic 15 Puzzle.</desc>
  <rect width="960" height="540" rx="28" fill="#f5f4f2"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(55 126)">
      <text x="120" y="-34" fill="#19191a" font-size="28" font-weight="700">3×3</text>
      <rect width="240" height="240" rx="18" fill="#e8e7e4" stroke="#cfc8b8" stroke-width="2"/>
      <g fill="#ffffff" stroke="#cfc8b8" stroke-width="3" font-family="Georgia,serif" font-size="34" font-weight="800">
        <rect x="12" y="12" width="66" height="66" rx="8"/><rect x="87" y="12" width="66" height="66" rx="8"/><rect x="162" y="12" width="66" height="66" rx="8"/>
