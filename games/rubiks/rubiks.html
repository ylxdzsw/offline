<template id="rubiks-game-template">
    <style>
        :host {
            display: grid; height: 100%; min-height: 0; color: var(--ink);
            grid-template-rows: auto auto auto minmax(0, 1fr);
        }
        .toolbar {
            display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px; margin-bottom: 9px;
        }
        button {
            min-height: var(--control-h, 42px); padding: 0 12px;
            border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
            color: var(--ink); background: var(--bg-surface); font-weight: 650;
        }
        button.primary { color: var(--accent-ink); border-color: var(--accent); background: var(--accent); }
        button:disabled { opacity: .42; }
        .warning { margin: 0 0 9px; color: var(--danger); font-size: .77rem; text-align: center; }
        .warning[hidden] { display: none; }
        .dashboard {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px; margin-bottom: 9px;
        }
        .meter {
            display: grid; min-width: 0; min-height: 45px; padding: 5px 9px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            place-content: center; text-align: center; background: var(--bg-surface);
            box-shadow: var(--shadow-soft);
        }
        .meter span {
            color: var(--ink-muted); font-size: .62rem; font-weight: 750;
            line-height: 1; text-transform: uppercase;
        }
        .meter strong {
            margin-top: 4px; font-family: var(--font-display); font-size: 1.05rem;
            font-variant-numeric: tabular-nums; line-height: 1;
        }
        .status {
            display: flex; min-height: 40px; align-items: center; justify-content: center;
            margin: 0 0 6px; padding: 6px 10px; border-radius: var(--radius-sm);
            color: var(--status-ink); background: var(--status-bg);
            font-size: .84rem; font-weight: 700; line-height: 1.3; text-align: center;
        }
        .board {
            position: relative; min-width: 0; min-height: 0; overflow: hidden;
            border-radius: var(--radius-sm); background: var(--bg-fill);
            touch-action: none; user-select: none;
        }
        .cube-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
        .cube-canvas:focus-visible { box-shadow: inset 0 0 0 3px var(--focus); }
        .fallback {
            position: absolute; inset: 0; display: grid; padding: 24px;
            place-items: center; color: var(--ink-muted); text-align: center;
        }
        .fallback[hidden] { display: none; }
        @media (max-width: 340px) {
            .toolbar { gap: 5px; }
            button { padding-inline: 9px; font-size: .8rem; }
        }
        @media (max-height: 500px) and (min-width: 500px) {
            :host {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: auto auto minmax(0, 1fr); column-gap: 8px;
            }
            .toolbar, .board { grid-column: 1 / -1; }
            .dashboard { grid-column: 1; margin-bottom: 6px; }
            .status { grid-column: 2; min-height: 45px; margin-bottom: 6px; }
        }
    </style>
    <div class="toolbar">
        <button class="scramble primary" type="button"></button>
        <button class="undo" type="button"></button>
        <button class="reset" type="button"></button>
    </div>
    <p class="warning" hidden></p>
    <div class="dashboard">
        <div class="meter"><span class="moves-label"></span><strong class="move-count">0</strong></div>
        <div class="meter"><span class="time-label"></span><strong class="timer">00:00</strong></div>
    </div>
    <div class="status" role="status" aria-live="polite"></div>
    <div class="board"><p class="fallback" hidden></p></div>
</template>

<script>
customElements.define('rubiks-game', class extends HTMLElement {
    constructor() {
        super()
        this.attachShadow({mode: 'open'}).append(
            document.getElementById('rubiks-game-template').content.cloneNode(true)
        )
        this.notice = null
        this.sequence = false
        this.timerOrigin = null
        this.timerInterval = null
        this.visibilityHandler = () => this.visibilityChanged()
    }

    connectedCallback() {
        this.engine = OfflineGames.Rubiks
        this.i18n = OfflineGames.i18n
        this.storage = OfflineGames.storage
        this.load()
        this.bind()
        this.createStage()
        this.localize()
        this.render()
        this.resumeTimer()
        document.addEventListener('visibilitychange', this.visibilityHandler)
    }

    disconnectedCallback() {
        document.removeEventListener('visibilitychange', this.visibilityHandler)
        this.pauseTimer(true)
        this.stage?.dispose()
    }

    fresh() {
        const seed = OfflineGames.runtime.randomSeed()
        const started = this.engine.newGame(seed)
        return {
            schema: 1,
            game: 'rubiks',
            seed,
            cube: started.state,
            scramble: started.moves,
            history: [],
            elapsedMs: 0,
            progress: false,
            outcome: null,
        }
    }

    valid(saved) {
        if (!saved || saved.schema !== 1 || saved.game !== 'rubiks'
            || !Number.isInteger(saved.seed) || saved.seed < 0 || saved.seed > 0xffffffff
            || !this.engine.validate(saved.cube)
            || !Array.isArray(saved.scramble) || saved.scramble.length !== 25
            || !Array.isArray(saved.history)
            || !Number.isFinite(saved.elapsedMs) || saved.elapsedMs < 0
            || typeof saved.progress !== 'boolean'
            || ![null, 'solved'].includes(saved.outcome)) return false
        try {
            saved.scramble.forEach(move => this.engine.inverse(move))
            saved.history.forEach(move => this.engine.inverse(move))
        } catch { return false }
        return this.engine.isSolved(saved.cube) === (saved.outcome === 'solved')
    }

    load() {
        const saved = this.storage.read('rubiks')
        this.state = this.valid(saved) ? saved : this.fresh()
    }

    bind() {
        const s = this.shadowRoot
        s.querySelector('.scramble').addEventListener('click', () => this.newScramble())
        s.querySelector('.undo').addEventListener('click', () => this.undo())
        s.querySelector('.reset').addEventListener('click', () => this.reset())
    }

    createStage() {
        const board = this.shadowRoot.querySelector('.board')
        this.stage = new OfflineGames.Rubiks3D.RubiksStage({
            container: board,
            engine: this.engine,
            state: this.state.cube,
            onTurn: move => this.commitTurn(move),
            onError: () => {
                this.notice = 'rubiksWebglError'
                board.querySelector('.fallback').hidden = false
                this.render()
            },
        })
        const canvas = this.stage.canvas()
        if (!canvas) return
        canvas.addEventListener('keydown', event => this.keyboardTurn(event))
    }

    localize() {
        const s = this.shadowRoot, t = key => this.i18n.t(key)
        s.querySelector('.scramble').textContent = t('rubiksScramble')
        s.querySelector('.undo').textContent = t('undo')
        s.querySelector('.reset').textContent = t('rubiksReset')
        s.querySelector('.moves-label').textContent = t('rubiksMoves')
        s.querySelector('.time-label').textContent = t('slidingTime')
        s.querySelector('.warning').textContent = t('storageWarning')
        s.querySelector('.fallback').textContent = t('rubiksWebglError')
        const canvas = this.stage?.canvas()
        if (canvas) {
            canvas.setAttribute('aria-label', t('rubiksCube'))
            canvas.setAttribute('role', 'application')
        }
    }

    keyboardTurn(event) {
        if (this.sequence || this.stage?.isBusy() || event.ctrlKey || event.metaKey || event.altKey) return
        const move = {
            r: {axis: 'x', layer: 1, turns: -1},
            l: {axis: 'x', layer: -1, turns: 1},
            u: {axis: 'y', layer: 1, turns: -1},
            d: {axis: 'y', layer: -1, turns: 1},
            f: {axis: 'z', layer: 1, turns: -1},
            b: {axis: 'z', layer: -1, turns: 1},
        }[event.key.toLowerCase()]
        if (!move) return
        event.preventDefault()
        this.stage.animateTurn(event.shiftKey ? {...move, turns: -move.turns} : move, 170)
    }

    commitTurn(move) {
        this.state.cube = this.engine.turn(this.state.cube, move)
        this.state.history.push(move)
        this.state.progress = true
        this.state.outcome = this.engine.isSolved(this.state.cube) ? 'solved' : null
        this.notice = null
        if (this.state.outcome) this.pauseTimer(false)
        else this.resumeTimer()
        this.save()
        this.render()
        return this.state.cube
    }

    async undo() {
        if (this.sequence || this.stage?.isBusy()) return
        const move = this.state.history.at(-1)
        if (!move) return
        const inverse = this.engine.inverse(move)
        const duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 150
        await this.stage.animateTurn(inverse, duration, false)
        this.state.history.pop()
        this.state.cube = this.engine.turn(this.state.cube, inverse)
        this.state.outcome = null
        this.notice = null
        this.resumeTimer()
        this.save()
        this.render()
        this.stage.canvas()?.focus()
    }

    async newScramble() {
        if (this.sequence || this.stage?.isBusy()) return
        if (this.state.progress && !this.state.outcome && !confirm(this.i18n.t('confirmNew'))) return
        this.pauseTimer(false)
        const next = this.fresh()
        this.sequence = true
        this.notice = 'rubiksScrambling'
        this.stage.setInputEnabled(false)
        this.stage.setState(this.engine.solved())
        this.render()
        const duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 76
        for (const move of next.scramble) await this.stage.animateTurn(move, duration, false)
        this.state = next
        this.sequence = false
        this.notice = null
        this.stage.setInputEnabled(true)
        this.save()
        this.render()
        this.stage.canvas()?.focus()
    }

    reset() {
        if (this.sequence || this.stage?.isBusy()) return
        if (this.state.progress && !this.state.outcome && !confirm(this.i18n.t('rubiksConfirmReset'))) return
        this.pauseTimer(false)
        this.state.cube = this.engine.solved()
        this.state.history = []
        this.state.elapsedMs = 0
        this.state.progress = false
        this.state.outcome = 'solved'
        this.notice = 'rubiksResetDone'
        this.stage.setState(this.state.cube)
        this.save()
        this.render()
        this.stage.canvas()?.focus()
    }

    syncTimer() {
        if (this.timerOrigin != null) this.state.elapsedMs = Math.max(0, performance.now() - this.timerOrigin)
    }

    resumeTimer() {
        if (!this.state.progress || this.state.outcome || this.timerOrigin != null
            || document.visibilityState === 'hidden') return
        this.timerOrigin = performance.now() - this.state.elapsedMs
        this.timerInterval = setInterval(() => {
            this.syncTimer()
            this.renderTimer()
        }, 250)
    }

    pauseTimer(persist) {
        this.syncTimer()
        if (this.timerInterval != null) clearInterval(this.timerInterval)
        this.timerInterval = null
        this.timerOrigin = null
        if (persist && this.state) this.writeState()
    }

    visibilityChanged() {
        if (document.visibilityState === 'hidden') this.pauseTimer(true)
        else this.resumeTimer()
    }

    save() {
        this.syncTimer()
        this.writeState()
    }

    writeState() {
        if (!this.storage.write('rubiks', this.state)) this.shadowRoot.querySelector('.warning').hidden = false
    }

    formatTime() {
        const seconds = Math.floor(this.state.elapsedMs / 1000)
        const minutes = Math.floor(seconds / 60)
        return `${String(minutes).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`
    }

    renderTimer() { this.shadowRoot.querySelector('.timer').textContent = this.formatTime() }

    format(key, values) {
        return Object.entries(values).reduce(
            (text, [name, value]) => text.replace(`{${name}}`, String(value)),
            this.i18n.t(key),
        )
    }

    render() {
        const s = this.shadowRoot
        s.querySelector('.move-count').textContent = String(this.state.history.length)
        this.renderTimer()
        const disabled = this.sequence || Boolean(this.stage?.isBusy())
        s.querySelector('.scramble').disabled = disabled
        s.querySelector('.undo').disabled = disabled || this.state.history.length === 0
        s.querySelector('.reset').disabled = disabled
        const status = this.notice === 'rubiksWebglError'
            ? this.i18n.t('rubiksWebglError')
            : this.sequence
                ? this.i18n.t('rubiksScrambling')
                : this.notice
                    ? this.i18n.t(this.notice)
                    : this.state.outcome === 'solved'
                        ? this.format('rubiksSolved', {moves: this.state.history.length, time: this.formatTime()})
                        : this.i18n.t('rubiksPrompt')
        s.querySelector('.status').textContent = status
    }
})
</script>
