<template id="sudoku-game-template">
    <style>
        :host { display: block; color: var(--ink); }
        .toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; margin-bottom: 10px; }
        label { display: grid; gap: 3px; color: var(--ink-muted); font-size: .7rem; font-weight: 600; letter-spacing: .02em; }
        select, button {
            min-height: var(--control-h, 42px); border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm); color: var(--ink); background: var(--bg-surface);
        }
        select { min-width: 96px; padding: 0 28px 0 10px; }
        button { padding: 0 12px; font-weight: 650; touch-action: manipulation; }
        button:disabled { opacity: .4; }
        .status {
            display: flex; min-height: 38px; align-items: center; justify-content: center;
            margin: 0 0 9px; border-radius: var(--radius-sm);
            color: var(--status-ink); font-size: .9rem; font-weight: 700; background: var(--status-bg);
        }
        .warning { margin: 0 0 9px; color: var(--danger); font-size: .77rem; text-align: center; }
        .warning[hidden] { display: none; }
        .board {
            position: relative; display: grid; width: 100%; aspect-ratio: 1; grid-template: repeat(9, 1fr) / repeat(9, 1fr);
            overflow: hidden; border: 2px solid var(--board-paper-box); border-radius: var(--radius-sm);
            background: var(--board-paper); box-shadow: var(--shadow-soft); user-select: none;
        }
        .board[data-win]::before {
            position: absolute; z-index: 4; top: 50%; left: 50%; width: 42%; padding: 9px 7px;
            border: 3px double var(--accent); border-radius: 4px; content: attr(data-win);
            color: var(--accent); background: color-mix(in srgb, var(--board-paper) 90%, transparent);
            box-shadow: 0 3px 12px color-mix(in srgb, var(--ink) 16%, transparent);
            font-family: var(--font-display); font-size: clamp(.78rem, 4vw, 1.05rem);
            font-weight: 800; line-height: 1.2; text-align: center; transform: translate(-50%, -50%) rotate(-2deg);
            pointer-events: none;
        }
        .cell {
            position: relative; display: grid; min-width: 0; min-height: 0; padding: 0; border: 0;
            border-right: 1px solid var(--board-paper-line); border-bottom: 1px solid var(--board-paper-line);
            border-radius: 0; place-items: center; color: var(--focus); background: var(--board-paper);
            font-size: clamp(1.05rem, 6vw, 1.55rem); font-weight: 600;
        }
        .cell:nth-child(9n) { border-right: 0; }
        .cell:nth-child(n+73) { border-bottom: 0; }
        .cell.box-right { border-right: 2px solid var(--board-paper-box); }
        .cell.box-bottom { border-bottom: 2px solid var(--board-paper-box); }
        .cell.given { color: var(--ink); font-weight: 750; }
        .cell.related { background: var(--bg-elevated); }
        .cell.same { background: var(--accent-soft); }
        .cell.selected { background: color-mix(in srgb, var(--selected) 18%, var(--board-paper)); box-shadow: inset 0 0 0 2px var(--selected); }
        .cell.conflict { color: var(--danger); background: var(--danger-soft); }
        .entry { display: grid; width: 100%; height: 100%; place-items: center; }
        .cell.changed { animation: sudoku-cell .2s ease-out; }
        .cell.changed > .entry, .cell.changed > .notes { animation: sudoku-entry .2s ease-out; }
        @keyframes sudoku-cell { from { filter: brightness(1.16); } }
        @keyframes sudoku-entry { from { opacity: .3; transform: scale(.68); } }
        .notes {
            position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            color: var(--ink-faint); font-size: clamp(.5rem, 2.7vw, .72rem); font-weight: 650; line-height: 1;
        }
        .notes i { display: grid; place-items: center; font-style: normal; }
        .pad {
            display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-top: 10px;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        .digit {
            min-width: 0; min-height: 45px; padding: 0; border-color: var(--border-strong);
            color: var(--ink); background: var(--bg-elevated); font-size: 1.1rem; touch-action: manipulation;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        .digit.complete { opacity: .36; }
        .tools { display: grid; margin-top: 8px; }
        @media (prefers-reduced-motion: reduce) {
            .cell.changed, .cell.changed > .entry, .cell.changed > .notes { animation: none; }
        }
        @media (max-width: 340px) { .toolbar { gap: 4px; } button { padding-inline: 8px; font-size: .82rem; } select { min-width: 88px; } .digit { min-height: 41px; } }
    </style>
    <div class="toolbar">
        <label><span class="difficulty-label"></span><select class="difficulty"><option value="easy"></option><option value="medium"></option><option value="hard"></option></select></label>
        <button class="undo" type="button"></button>
        <button class="new" type="button"></button>
    </div>
    <p class="warning" hidden></p>
    <div class="status" role="status" aria-live="polite"></div>
    <div class="board" role="grid"></div>
    <div class="pad" aria-label="Number pad"></div>
    <div class="tools">
        <button class="tool erase" type="button"></button>
    </div>
</template>

<script>
customElements.define('sudoku-game', class extends HTMLElement {
    constructor() {
        super()
        this.attachShadow({mode: 'open'}).append(document.getElementById('sudoku-game-template').content.cloneNode(true))
        this.selected = null
        this.changedIndex = null
        this.longPressTimer = null
        this.longPressHandled = false
        this.touchDigit = null
        this.touchStartedAt = 0
        this.ignoreClickUntil = 0
    }
    connectedCallback() {
        this.engine = OfflineGames.Sudoku
        this.i18n = OfflineGames.i18n
        this.storage = OfflineGames.storage
        this.load()
        this.bind()
        this.localize()
        this.render()
    }
    fresh(difficulty = 'medium') {
        const seed = OfflineGames.runtime.randomSeed(), generated = this.engine.generate(difficulty, seed)
        return {schema: 1, game: 'sudoku', seed, difficulty, puzzle: generated.puzzle, solution: generated.solution, board: generated.puzzle.slice(), notes: Array(81).fill(0), history: [], outcome: null}
    }
    valid(saved) {
        return saved && ['easy', 'medium', 'hard'].includes(saved.difficulty) && [saved.puzzle, saved.solution, saved.board, saved.notes].every(value => Array.isArray(value) && value.length === 81) && Array.isArray(saved.history)
    }
    load() { const saved = this.storage.read('sudoku'); this.state = this.valid(saved) ? saved : this.fresh(); if (!Number.isInteger(this.state.seed)) this.state.seed = OfflineGames.runtime.randomSeed() }
    bind() {
        const shadow = this.shadowRoot
        shadow.querySelector('.board').addEventListener('click', event => { const cell = event.target.closest('.cell'); if (cell) { this.selected = Number(cell.dataset.index); this.render() } })
        const pad = shadow.querySelector('.pad')
        const beginPress = digit => {
            clearTimeout(this.longPressTimer)
            this.longPressHandled = false
            this.longPressTimer = setTimeout(() => {
                this.longPressHandled = true
                this.enter(digit, true)
            }, 500)
        }
        const endPress = () => { clearTimeout(this.longPressTimer); this.longPressTimer = null }
        pad.addEventListener('pointerdown', event => {
            const digit = event.target.closest('.digit')
            if (!digit || event.pointerType === 'touch' || event.button !== 0) return
            beginPress(Number(digit.dataset.digit))
        })
        pad.addEventListener('pointerup', endPress)
        pad.addEventListener('pointercancel', endPress)
        pad.addEventListener('touchstart', event => {
            const digit = event.target.closest('.digit')
            if (!digit) return
            event.preventDefault()
            this.touchDigit = Number(digit.dataset.digit)
            this.touchStartedAt = performance.now()
        }, {passive: false})
        pad.addEventListener('touchend', event => {
            if (this.touchDigit == null) return
            event.preventDefault()
            const digit = this.touchDigit
            const asNote = performance.now() - this.touchStartedAt >= 500
            this.touchDigit = null
            this.touchStartedAt = 0
            this.ignoreClickUntil = performance.now() + 1000
            this.enter(digit, asNote)
        }, {passive: false})
        pad.addEventListener('touchcancel', () => {
            this.touchDigit = null
            this.touchStartedAt = 0
        })
        pad.addEventListener('click', event => {
            const digit = event.target.closest('.digit')
            if (!digit) return
            if (event.detail > 0 && performance.now() < this.ignoreClickUntil) return
            if (this.longPressHandled && event.detail > 0) {
                this.longPressHandled = false
                return
            }
            this.longPressHandled = false
            this.enter(Number(digit.dataset.digit))
        })
        pad.addEventListener('contextmenu', event => {
            if (event.target.closest('.digit')) event.preventDefault()
        })
        shadow.querySelector('.erase').addEventListener('click', () => this.enter(0))
        shadow.querySelector('.undo').addEventListener('click', () => this.undo())
        shadow.querySelector('.new').addEventListener('click', () => this.newGame())
        shadow.querySelector('.difficulty').addEventListener('change', event => this.newGame(event.target.value, true))
        this.addEventListener('keydown', event => {
            if (/^[1-9]$/.test(event.key)) this.enter(Number(event.key), event.shiftKey)
            else if (event.key === 'Backspace' || event.key === 'Delete') this.enter(0)
        })
    }
    localize() {
        const s = this.shadowRoot, t = key => this.i18n.t(key)
        s.querySelector('.difficulty-label').textContent = t('difficulty')
        for (const option of s.querySelectorAll('.difficulty option')) option.textContent = t(option.value)
        s.querySelector('.undo').textContent = t('undo'); s.querySelector('.new').textContent = t('newGame')
        s.querySelector('.erase').textContent = t('erase')
        s.querySelector('.warning').textContent = t('storageWarning')
    }
    save() { if (!this.storage.write('sudoku', this.state)) this.shadowRoot.querySelector('.warning').hidden = false }
    enter(digit, asNote = false) {
        const index = this.selected
        if (index == null || this.state.outcome || this.state.puzzle[index]) return
        const before = {index, value: this.state.board[index], notes: this.state.notes[index], peerNotes: []}
        if (asNote && digit) {
            if (this.state.board[index]) return
            this.state.notes[index] ^= 1 << digit
        } else {
            this.state.board[index] = digit
            this.state.notes[index] = 0
            if (digit) for (const peer of this.engine.peers(index)) if (this.state.notes[peer] & (1 << digit)) { before.peerNotes.push([peer, this.state.notes[peer]]); this.state.notes[peer] &= ~(1 << digit) }
        }
        if (before.value === this.state.board[index] && before.notes === this.state.notes[index]) return
        this.state.history.push(before)
        this.changedIndex = index
        if (this.engine.isComplete(this.state.board, this.state.solution)) this.state.outcome = {ended: true, reason: 'solved'}
        this.save(); this.render()
    }
    undo() {
        const previous = this.state.history.pop(); if (!previous) return
        this.state.board[previous.index] = previous.value; this.state.notes[previous.index] = previous.notes
        for (const [index, notes] of previous.peerNotes) this.state.notes[index] = notes
        this.state.outcome = null; this.selected = previous.index; this.changedIndex = previous.index; this.save(); this.render()
    }
    newGame(difficulty = this.state.difficulty, force = false) {
        if (!force && this.state.history.length && !this.state.outcome && !confirm(this.i18n.t('confirmNew'))) return
        this.state = this.fresh(difficulty); this.selected = null; this.save(); this.render()
    }
    render() {
        const s = this.shadowRoot, selectedValue = this.selected == null ? 0 : this.state.board[this.selected], changedIndex = this.changedIndex
        s.querySelector('.board').innerHTML = this.state.board.map((value, index) => {
            const classes = ['cell']; const row = this.engine.rowOf(index), column = this.engine.columnOf(index)
            if (column === 2 || column === 5) classes.push('box-right'); if (row === 2 || row === 5) classes.push('box-bottom')
            if (this.state.puzzle[index]) classes.push('given')
            if (this.selected != null && (row === this.engine.rowOf(this.selected) || column === this.engine.columnOf(this.selected) || this.engine.boxOf(index) === this.engine.boxOf(this.selected))) classes.push('related')
            if (selectedValue && value === selectedValue) classes.push('same')
            if (this.engine.conflicts(this.state.board, index).length) classes.push('conflict')
            if (index === this.selected) classes.push('selected')
            if (index === changedIndex) classes.push('changed')
            const notes = !value ? `<span class="notes">${this.engine.DIGITS.map(digit => `<i>${this.state.notes[index] & (1 << digit) ? digit : ''}</i>`).join('')}</span>` : ''
            const content = value ? (this.state.puzzle[index] ? value : `<span class="entry">${value}</span>`) : notes
            return `<button type="button" role="gridcell" class="${classes.join(' ')}" data-index="${index}" aria-selected="${index === this.selected}" aria-label="${this.i18n.t('row')} ${row + 1}, ${this.i18n.t('column')} ${column + 1}, ${value || this.i18n.t('empty')}">${content}</button>`
        }).join('')
        this.changedIndex = null
        const counts = this.engine.DIGITS.map(digit => this.state.board.filter(value => value === digit).length)
        s.querySelector('.pad').innerHTML = this.engine.DIGITS.map((digit, index) => `<button type="button" class="digit${counts[index] >= 9 ? ' complete' : ''}" data-digit="${digit}" aria-label="${digit}; ${this.i18n.t('longPressNote')}" ${counts[index] >= 9 ? 'disabled' : ''}>${digit}</button>`).join('')
        const statusText = this.i18n.t(this.state.outcome ? 'sudokuSolved' : 'sudokuPrompt')
        s.querySelector('.status').textContent = statusText
        const board = s.querySelector('.board')
        if (this.state.outcome?.reason === 'solved') board.dataset.win = statusText
        else delete board.dataset.win
        s.querySelector('.difficulty').value = this.state.difficulty
        s.querySelector('.undo').disabled = !this.state.history.length
    }
    disconnectedCallback() { clearTimeout(this.longPressTimer) }
})
</script>
