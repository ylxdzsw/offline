[package]
name = "offline-go"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ylxdzsw"]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
goban = "=0.20.1"
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
