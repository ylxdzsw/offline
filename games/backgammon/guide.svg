<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Backgammon movement and bearing off</title>
  <desc id="description">A complete backgammon board with opposing checker paths, dice, bar, doubling cube, and bear-off trays.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#744332"/>
      <stop offset="1" stop-color="#4f2c23"/>
    </linearGradient>
    <radialGradient id="light" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset=".55" stop-color="#eadfc8"/>
      <stop offset="1" stop-color="#b9aa91"/>
    </radialGradient>
    <radialGradient id="dark" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#75665e"/>
      <stop offset=".55" stop-color="#39302d"/>
      <stop offset="1" stop-color="#171414"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#28130d" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2d6357"/>
    </marker>
    <g id="light-checker"><circle r="21" fill="url(#light)" stroke="#887b67" stroke-width="2"/><circle r="14" fill="none" stroke="#fff" stroke-opacity=".42"/></g>
    <g id="dark-checker"><circle r="21" fill="url(#dark)" stroke="#171313" stroke-width="2"/><circle r="14" fill="none" stroke="#fff" stroke-opacity=".10"/></g>
  </defs>
