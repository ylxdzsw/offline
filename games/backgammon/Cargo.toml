[package]
name = "offline-backgammon"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ylxdzsw"]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
backgammon = "=0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
