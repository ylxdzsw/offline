<template id="xiangqi-game-template">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :host { display: block; color: var(--ink); }
        .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto; gap: 8px; align-items: end; margin-bottom: 10px; }
        label { display: grid; gap: 3px; color: var(--ink-muted); font-size: .7rem; font-weight: 600; letter-spacing: .02em; }
        select, .action {
            min-height: var(--control-h, 42px);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--ink);
            background: var(--bg-surface);
        }
        select { width: 100%; min-width: 0; padding: 0 28px 0 10px; }
        .action { padding: 0 12px; font-weight: 650; }
        .action:disabled { opacity: .42; }
        .status {
            display: flex; min-height: 38px; align-items: center; justify-content: center;
            margin: 0 0 9px; border-radius: var(--radius-sm);
            color: var(--status-ink); font-size: .92rem; font-weight: 700;
            background: var(--status-bg);
        }
        .status.thinking::after {
            width: 5px; height: 5px; margin-left: 7px; border-radius: 50%;
            content: ""; background: currentColor;
            animation: pulse .8s ease-in-out infinite alternate;
        }
        @keyframes pulse { to { opacity: .2; transform: scale(.7); } }
        .warning { margin: 0 0 9px; color: var(--danger); font-size: .77rem; text-align: center; }
        .warning[hidden] { display: none; }
        .board {
            --edge: clamp(16px, 5.4vw, 25px);
            position: relative; width: 100%; aspect-ratio: 8 / 9.45; overflow: hidden;
            border: 2px solid var(--board-wood-edge); border-radius: var(--radius-sm);
            background:
                radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--board-wood-deep) 35%, transparent), transparent 55%),
                var(--board-wood);
            box-shadow: inset 0 0 22px color-mix(in srgb, var(--board-wood-line) 18%, transparent), var(--shadow-soft);
            touch-action: manipulation; user-select: none;
        }
        .board[data-win]::after {
            position: absolute; z-index: 5; top: 50%; left: 50%; display: grid; width: 28%; aspect-ratio: 1;
            border: 4px double var(--piece-red); border-radius: 50%; content: attr(data-win); place-items: center;
            color: var(--piece-red); background: color-mix(in srgb, var(--piece-face) 90%, transparent);
            box-shadow: 0 4px 14px rgba(70,35,15,.25); font-family: var(--font-display);
            font-size: clamp(.78rem, 4.3vw, 1.15rem); font-weight: 850; text-align: center;
            transform: translate(-50%, -50%) rotate(-3deg); pointer-events: none;
        }
        .field { position: absolute; inset: var(--edge); }
        svg { width: 100%; height: 100%; overflow: visible; }
        svg line, svg path { fill: none; stroke: var(--board-wood-line); stroke-width: .035; }
        .river {
            position: absolute; top: 50%; left: 17%; right: 17%;
            display: flex; justify-content: space-between;
            color: color-mix(in srgb, var(--board-wood-line) 85%, transparent);
            font-family: var(--font-display); font-size: clamp(.7rem, 3vw, 1rem);
            letter-spacing: .18em; transform: translateY(-50%); pointer-events: none;
        }
        .board.flipped .river { flex-direction: row-reverse; }
        .spot {
            position: absolute; display: grid;
            width: clamp(28px, 9.7vw, 44px); height: clamp(28px, 9.7vw, 44px);
            padding: 0; border: 0; border-radius: 50%; place-items: center;
            color: transparent; background: transparent; transform: translate(-50%, -50%);
        }
        .spot.legal::after {
            position: absolute; z-index: 2; width: 9px; height: 9px; border-radius: 50%; content: "";
            background: var(--legal); box-shadow: 0 0 0 4px var(--legal-soft);
        }
        .spot.capture::after {
            position: absolute; z-index: 2; inset: -2px;
            border: 3px solid var(--capture); border-radius: 50%; content: "";
        }
        .spot.last::before, .spot.selected::before {
            position: absolute; z-index: 2; inset: -2px;
            border: 3px solid var(--accent); border-radius: 50%; content: "";
        }
        .spot.last::before { border-width: 2px; border-color: var(--selected); }
        .piece {
            position: relative; z-index: 1; display: grid; width: 91%; height: 91%;
            border: 2px solid currentColor; border-radius: 50%; place-items: center;
            font-family: var(--font-display); font-size: clamp(1rem, 5.7vw, 1.7rem);
            font-weight: 800; line-height: 1; background: var(--piece-face);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 18%, transparent), 0 2px 3px rgba(0, 0, 0, .22);
        }
        .piece.red { color: var(--piece-red); }
        .piece.black { color: var(--piece-black); }
        .spot.last-to .piece { animation: land .22s ease-out; }
        @keyframes land { from { opacity: .4; transform: scale(.72); } }
        .board[aria-disabled="true"] .spot { cursor: wait; }
        @media (prefers-reduced-motion: reduce) {
            .status.thinking::after, .spot.last-to .piece { animation: none; }
        }
        @media (max-width: 420px) {
            .toolbar { grid-template-columns: 1fr 1fr; gap: 6px; }
            .action { width: 100%; }
        }
    </style>
    <div class="toolbar">
        <label><span class="difficulty-label"></span><select class="difficulty">
            <option value="easy"></option>
            <option value="medium"></option>
            <option value="hard"></option>
        </select></label>
        <label><span class="side-label"></span><select class="side">
            <option value="r" data-i18n="red"></option>
            <option value="b" data-i18n="black"></option>
        </select></label>
        <button class="action undo" type="button"></button>
        <button class="action new" type="button"></button>
    </div>
    <p class="warning" hidden></p>
    <div class="status" role="status" aria-live="polite"></div>
    <div class="board" role="grid">
        <div class="field">
            <svg viewBox="0 0 8 9" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 0H8V9H0Z M0 1H8 M0 2H8 M0 3H8 M0 4H8 M0 5H8 M0 6H8 M0 7H8 M0 8H8 M1 0V4 M1 5V9 M2 0V4 M2 5V9 M3 0V4 M3 5V9 M4 0V4 M4 5V9 M5 0V4 M5 5V9 M6 0V4 M6 5V9 M7 0V4 M7 5V9 M3 0L5 2 M5 0L3 2 M3 7L5 9 M5 7L3 9" />
            </svg>
            <div class="river"><span>楚 河</span><span>漢 界</span></div>
            <div class="spots"></div>
        </div>
    </div>
</template>

<script>
const XIANGQI_MIN_AI_TURN_MS = 360

OfflineGames.wasm.defineElement('xiangqi', 'xiangqi-game', class extends HTMLElement {
    constructor() {
        super()
        this.attachShadow({mode: 'open'}).append(document.getElementById('xiangqi-game-template').content.cloneNode(true))
        this.selected = null
        this.legal = []
        this.thinking = false
        this.worker = null
        this.aiTimer = null
        this.aiStartedAt = 0
        this.requestId = 0
    }

    connectedCallback() {
        this.engine = OfflineGames.Xiangqi
        this.i18n = OfflineGames.i18n
        this.storage = OfflineGames.storage
        this.load()
        this.bind()
        this.localize()
        this.render()
        if (this.state.turn === this.aiSide() && !this.state.outcome) this.requestAI()
    }

    disconnectedCallback() {
        this.cancelAI()
    }

    fresh(difficulty = 'medium', humanSide = this.engine.RED) {
        const board = this.engine.initialBoard()
        return {
            schema: 1,
            game: 'xiangqi',
            seed: OfflineGames.runtime.randomSeed(),
            board,
            turn: this.engine.RED,
            difficulty,
            humanSide,
            history: [],
            keys: [this.engine.positionKey(board, this.engine.RED)],
            outcome: null,
        }
    }

    valid(saved) {
        return saved && Array.isArray(saved.board) && saved.board.length === 90
            && [this.engine.RED, this.engine.BLACK].includes(saved.turn)
            && ['easy', 'medium', 'hard'].includes(saved.difficulty)
            && (saved.humanSide == null || [this.engine.RED, this.engine.BLACK].includes(saved.humanSide))
            && Array.isArray(saved.history) && Array.isArray(saved.keys)
    }

    load() {
        const saved = this.storage.read('xiangqi')
        this.state = this.valid(saved) ? saved : this.fresh()
        if (!this.state.humanSide) this.state.humanSide = this.engine.RED
        if (!Number.isInteger(this.state.seed)) this.state.seed = OfflineGames.runtime.randomSeed()
    }

    aiSide() {
        return this.engine.other(this.state.humanSide)
    }

    bind() {
        const shadow = this.shadowRoot
        shadow.querySelector('.spots').addEventListener('click', event => {
            const button = event.target.closest('.spot')
            if (button) this.tap(Number(button.dataset.index))
        })
        shadow.querySelector('.undo').addEventListener('click', () => this.undo())
        shadow.querySelector('.new').addEventListener('click', () => this.newGame())
        shadow.querySelector('.difficulty').addEventListener('change', event => {
            this.state.difficulty = event.target.value
            this.save()
        })
        shadow.querySelector('.side').addEventListener('change', event => this.changeSide(event.target.value))
    }

    localize() {
        const shadow = this.shadowRoot
        shadow.querySelector('.difficulty-label').textContent = this.i18n.t('difficulty')
        shadow.querySelector('.side-label').textContent = this.i18n.t('playAs')
        for (const option of shadow.querySelectorAll('option')) option.textContent = this.i18n.t(option.dataset.i18n || option.value)
        shadow.querySelector('.undo').textContent = this.i18n.t('undo')
        shadow.querySelector('.new').textContent = this.i18n.t('newGame')
        shadow.querySelector('.warning').textContent = this.i18n.t('storageWarning')
    }

    repetitions() {
        return this.state.keys.reduce((counts, key) => {
            counts[key] = (counts[key] || 0) + 1
            return counts
        }, {})
    }

    save() {
        if (!this.storage.write('xiangqi', this.state)) this.shadowRoot.querySelector('.warning').hidden = false
    }

    tap(index) {
        const humanSide = this.state.humanSide
        if (this.thinking || this.state.outcome || this.state.turn !== humanSide) return
        const piece = this.state.board[index]
        if (this.selected == null) {
            if (this.engine.sideOf(piece) === humanSide) this.select(index)
            return
        }
        if (this.engine.sideOf(piece) === humanSide) {
            this.select(index)
            return
        }
        const move = this.legal.find(candidate => candidate.to === index)
        if (!move) {
            this.selected = null
            this.legal = []
            this.render()
            return
        }
        this.commit(move, humanSide)
        if (!this.state.outcome) this.requestAI()
    }

    select(index) {
        this.selected = index
        this.legal = this.engine.legalMoves(this.state.board, this.state.humanSide).filter(move => move.from === index)
        this.render()
    }

    commit(move, side) {
        const recorded = {...move, side}
        this.state.board = this.engine.applyMove(this.state.board, recorded)
        this.state.history.push(recorded)
        this.state.turn = this.engine.other(side)
        this.state.keys.push(this.engine.positionKey(this.state.board, this.state.turn))
        const result = this.engine.status(this.state.board, this.state.turn, this.repetitions())
        this.state.outcome = result.ended ? result : null
        this.selected = null
        this.legal = []
        this.save()
        this.render()
    }

    requestAI() {
        const aiSide = this.aiSide()
        if (this.state.outcome || this.state.turn !== aiSide) return
        this.cancelAI()
        this.thinking = true
        this.aiStartedAt = performance.now()
        const id = ++this.requestId
        this.worker = OfflineGames.runtime.createWorker('xiangqi-worker-payload')
        this.worker.onmessage = event => {
            if (event.data.id !== id || !this.thinking) return
            const legal = this.engine.legalMoves(this.state.board, aiSide)
            const move = legal.find(candidate => candidate.from === event.data.move?.from && candidate.to === event.data.move?.to)
            if (this.worker) this.worker.terminate()
            this.worker = null
            const delay = Math.max(0, XIANGQI_MIN_AI_TURN_MS - (performance.now() - this.aiStartedAt))
            this.aiTimer = setTimeout(() => {
                this.aiTimer = null
                if (id !== this.requestId || !this.thinking) return
                this.thinking = false
                if (move) this.commit(move, aiSide)
                else this.render()
            }, delay)
        }
        this.worker.onerror = error => {
            console.error(error)
            this.cancelAI(false)
            this.render()
        }
        this.worker.postMessage({id, board: this.state.board, side: aiSide, difficulty: this.state.difficulty, seed: OfflineGames.runtime.moveSeed(this.state.seed, this.state.history.length)})
        this.render()
    }

    cancelAI(invalidate = true) {
        if (invalidate) this.requestId++
        if (this.worker) this.worker.terminate()
        if (this.aiTimer) clearTimeout(this.aiTimer)
        this.worker = null
        this.aiTimer = null
        this.thinking = false
    }

    undo() {
        const humanMove = this.state.history.findLastIndex(move => move.side === this.state.humanSide)
        if (humanMove < 0) return
        this.cancelAI()
        while (this.state.history.length > humanMove) {
            const move = this.state.history.pop()
            this.state.board = this.engine.undoMove(this.state.board, move)
            this.state.keys.pop()
        }
        this.state.turn = this.state.humanSide
        this.state.outcome = null
        this.selected = null
        this.legal = []
        this.save()
        this.render()
    }

    newGame() {
        if (this.state.history.length && !confirm(this.i18n.t('confirmNew'))) return
        this.restart(this.state.humanSide)
    }

    changeSide(humanSide) {
        if (![this.engine.RED, this.engine.BLACK].includes(humanSide) || humanSide === this.state.humanSide) return
        if (this.state.history.length && !confirm(this.i18n.t('confirmNew'))) {
            this.shadowRoot.querySelector('.side').value = this.state.humanSide
            return
        }
        this.restart(humanSide)
    }

    restart(humanSide) {
        this.cancelAI()
        this.state = this.fresh(this.state.difficulty, humanSide)
        this.selected = null
        this.legal = []
        this.save()
        this.render()
        if (this.state.turn === this.aiSide()) this.requestAI()
    }

    statusText() {
        if (this.state.outcome) {
            if (!this.state.outcome.winner) return this.i18n.t('draw')
            return this.i18n.t(this.state.outcome.winner === this.state.humanSide ? 'youWin' : 'aiWins')
        }
        if (this.thinking || this.state.turn === this.aiSide()) return this.i18n.t('aiThinking')
        return this.i18n.t(this.engine.isInCheck(this.state.board, this.state.humanSide) ? 'check' : 'yourTurn')
    }

    pieceName(piece) {
        if (!piece) return this.i18n.t('empty')
        const color = this.engine.sideOf(piece) === this.engine.RED ? 'Red' : 'Black'
        return this.i18n.t('xiangqiPiece' + this.engine.typeOf(piece) + color)
    }

    render() {
        const shadow = this.shadowRoot
        const last = this.state.history.at(-1)
        const flipped = this.state.humanSide === this.engine.BLACK
        const legalTargets = new Map(this.legal.map(move => [move.to, Boolean(move.captured)]))
        const glyphs = {rK: '帥', rA: '仕', rE: '相', rH: '馬', rR: '車', rC: '炮', rP: '兵', bK: '將', bA: '士', bE: '象', bH: '馬', bR: '車', bC: '砲', bP: '卒'}
        shadow.querySelector('.spots').innerHTML = this.state.board.map((piece, index) => {
            const row = this.engine.rowOf(index)
            const column = this.engine.columnOf(index)
            const displayRow = flipped ? 9 - row : row
            const displayColumn = flipped ? 8 - column : column
            const classes = ['spot']
            if (this.selected === index) classes.push('selected')
            if (legalTargets.has(index)) classes.push(legalTargets.get(index) ? 'capture' : 'legal')
            if (last && (last.from === index || last.to === index)) classes.push('last')
            if (last?.to === index) classes.push('last-to')
            const labels = [this.pieceName(piece), `${this.i18n.t('row')} ${row + 1}`, `${this.i18n.t('column')} ${column + 1}`]
            if (this.selected === index) labels.push(this.i18n.t('selected'))
            if (legalTargets.has(index)) labels.push(this.i18n.t('legalMove'))
            if (last && (last.from === index || last.to === index)) labels.push(this.i18n.t('lastMove'))
            const token = piece ? `<span class="piece ${this.engine.sideOf(piece) === this.engine.RED ? 'red' : 'black'}">${glyphs[piece]}</span>` : ''
            return `<button type="button" role="gridcell" class="${classes.join(' ')}" data-index="${index}" aria-label="${labels.join(', ')}" style="left:${displayColumn / 8 * 100}%;top:${displayRow / 9 * 100}%">${token}</button>`
        }).join('')
        const status = shadow.querySelector('.status')
        status.textContent = this.statusText()
        status.classList.toggle('thinking', this.thinking)
        const board = shadow.querySelector('.board')
        board.classList.toggle('flipped', flipped)
        if (this.state.outcome?.winner === this.state.humanSide) board.dataset.win = status.textContent
        else delete board.dataset.win
        board.setAttribute('aria-disabled', String(this.thinking || this.state.turn !== this.state.humanSide || Boolean(this.state.outcome)))
        shadow.querySelector('.difficulty').value = this.state.difficulty
        shadow.querySelector('.side').value = this.state.humanSide
        shadow.querySelector('.undo').disabled = !this.state.history.some(move => move.side === this.state.humanSide)
    }
})
</script>
